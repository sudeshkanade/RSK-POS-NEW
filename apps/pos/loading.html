<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background-color: #000;
      color: #10b981;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    h1 {
      font-size: 24px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    p {
      color: #666;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>RestroOS</h1>
  <p>Booting Terminal Server...</p>
</body>
</html>
